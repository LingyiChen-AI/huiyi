# Pushing a tag like v0.2.0 builds and publishes that version: tests, a self-contained publish, the
# installer (HuiYi-Setup.exe), the portable zip, and the update package and feed that installed
# copies check, all on the GitHub release, with notes from the feat: / fix: commits since the last tag.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      REPO_URL: ${{ github.server_url }}/${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # all tags, for the release notes since the last version

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Version from the tag
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart("v")
          if ($v -notmatch '^\d+\.\d+\.\d+$') { throw "tag must look like v1.2.3" }
          "VERSION=$v" >> $env:GITHUB_ENV

      - name: Test
        run: dotnet test tests/HuiYi.Tests -c Release

      - name: Publish
        shell: pwsh
        run: |
          dotnet publish src/HuiYi/HuiYi.csproj -c Release -r win-x64 --self-contained true `
            -p:PublishReadyToRun=true -p:DebugType=none -p:Version=$env:VERSION -o publish
          Copy-Item LICENSE, NOTICE publish

      # Same version as the Velopack package in src/HuiYi/HuiYi.csproj.
      - name: Install vpk
        run: dotnet tool install -g vpk --version 1.2.161

      # What changed since the previous tag, from the feat: / fix: commit subjects. It goes into the
      # update package too: the 发现新版本 box shows it.
      - name: Release notes
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $prev = git describe --tags --abbrev=0 "$tag^" 2>$null
          $range = if ($prev) { "$prev..$tag" } else { $tag }
          $subjects = git log $range --no-merges --format=%s
          $feat = $subjects | Where-Object { $_ -match '^feat(\(.+\))?: ' } | ForEach-Object { "- " + ($_ -replace '^feat(\(.+\))?: ', '') }
          $fix = $subjects | Where-Object { $_ -match '^fix(\(.+\))?: ' } | ForEach-Object { "- " + ($_ -replace '^fix(\(.+\))?: ', '') }
          $notes = @("## 下载", "", "- **HuiYi-Setup.exe**：安装包，可以选安装位置，之后会自动更新", "- **HuiYi.App-win-Portable.zip**：免安装版，解压即用，也会自动更新", "")
          if ($feat) { $notes += @("## 新功能", "") + $feat + "" }
          if ($fix) { $notes += @("## 修复", "") + $fix + "" }
          if ($prev) { $notes += "完整改动：$env:REPO_URL/compare/$prev...$tag" }
          $notes -join "`n" | Out-File -Encoding utf8 notes.md
          Get-Content notes.md

      - name: Pack
        shell: pwsh
        run: |
          # No delta packages: with the Chinese title the stub is 会译_ExecutionStub.exe, and the zstd that
          # vpk runs for deltas can't open non-ASCII paths. Updates download the full package instead.
          vpk pack --packId HuiYi.App --packVersion $env:VERSION --packDir publish --mainExe HuiYi.exe `
            --packTitle "会译" --packAuthors "HuiYi" --icon assets/HuiYi.ico --delta none `
            --runtime win-x64 --releaseNotes notes.md --outputDir releases
          # The installer people download: lets them pick the folder, then runs the Setup.exe above.
          dotnet build installer/HuiYi.Setup.csproj -c Release -p:Version=$env:VERSION `
            -p:VelopackSetup="$PWD/releases/HuiYi.App-win-Setup.exe" -o installer-out
          New-Item -ItemType Directory -Force portable | Out-Null
          Copy-Item installer-out/HuiYi-Setup.exe portable/HuiYi-Setup.exe

      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          vpk upload github --repoUrl $env:REPO_URL --token $env:GH_TOKEN --outputDir releases `
            --tag $tag --releaseName "会译 $env:VERSION" --publish --merge
          gh release upload $tag "portable/HuiYi-Setup.exe" --clobber
          # Only what people or the updater use: Velopack's own Setup.exe is inside HuiYi-Setup.exe, and
          # RELEASES is the old Squirrel feed (installed copies read releases.win.json).
          foreach ($extra in "HuiYi.App-win-Setup.exe", "RELEASES") { gh release delete-asset $tag $extra -y }
          gh release edit $tag --notes-file notes.md
